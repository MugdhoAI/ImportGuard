  <text x="118" y="84" fill="url(#ivory)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="1">IMPORTGUARD</text>
  <text x="118" y="106" fill="#7FA3A8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" letter-spacing="3">CSV MAPPING / VALIDATION</text>

  <text x="56" y="198" fill="url(#ivory)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Make every import</text>
  <text x="56" y="250" fill="url(#ivory)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1">reviewable.</text>
  <text x="56" y="288" fill="#A7BDB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5">Map columns. Validate rows. Keep the decisions.</text>

  <rect x="56" y="314" width="368" height="34" rx="17" fill="#0A1F1B" stroke="#1E4D43"/>
  <circle cx="76" cy="331" r="4" fill="#34D399"><animate attributeName="r" values="4;5.6;4" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.6;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="90" y="335" fill="#8FE3C0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="0.8">DETERMINISTIC CORE · NO ARBITRARY CODE</text>
  <text x="56" y="378" fill="#5F7A76" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">HUMAN APPROVAL · REPEATABLE OUTPUT</text>

