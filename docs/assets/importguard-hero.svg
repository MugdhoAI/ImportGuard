<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04090B"/><stop offset=".55" stop-color="#060F13"/><stop offset="1" stop-color="#08161A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#2DD4BF" stop-opacity=".16"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#D7E2DB"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5EEAD4"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0C1A20"/><stop offset="1" stop-color="#081318"/>
    </linearGradient>
    <linearGradient id="cardHi" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0E2129"/><stop offset="1" stop-color="#0A161C"/>
    </linearGradient>
    <linearGradient id="greenB" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0F2E22"/><stop offset="1" stop-color="#0A2018"/>
    </linearGradient>
    <linearGradient id="rustB" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#352117"/><stop offset="1" stop-color="#251511"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity=".032"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <path id="flow1" d="M764 260H796" fill="none"/>
    <path id="flow2" d="M1076 260H1108" fill="none"/>
  </defs>

  <rect width="1440" height="520" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="520" rx="20" fill="url(#grid)"/>
  <ellipse cx="1180" cy="30" rx="720" ry="300" fill="url(#glow)"/>
  <rect x="1" y="1" width="1438" height="518" rx="19" stroke="#1C3038" stroke-width="2"/>

  <!-- Brand block -->
