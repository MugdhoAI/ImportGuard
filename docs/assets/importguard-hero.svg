    <text x="622" y="228" fill="#5F7A76" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="2">PAYMENT</text>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5">
      <text x="512" y="258" fill="#D9E6E0">00127</text><text x="622" y="258" fill="#9FB4AC">yes</text><path d="M713 252l5 5 9-10" stroke="#34D399" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="1;.15;1" keyTimes="0;.12;1" dur="3.6s" begin="0s" repeatCount="indefinite"/></path>
      <text x="512" y="290" fill="#D9E6E0">00128</text><text x="622" y="290" fill="#9FB4AC">no</text><path d="M713 284l5 5 9-10" stroke="#34D399" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="1;.15;1" keyTimes="0;.12;1" dur="3.6s" begin="0.35s" repeatCount="indefinite"/></path>
      <text x="512" y="322" fill="#D9E6E0">00129</text><text x="622" y="322" fill="#E8A58F">maybe</text><path d="M714 315l10 10M724 315l-10 10" stroke="#E07856" stroke-width="2.4" stroke-linecap="round"><animate attributeName="opacity" values="1;.15;1" keyTimes="0;.12;1" dur="3.6s" begin="0.7s" repeatCount="indefinite"/></path>
    </g>
    <path d="M512 348H736" stroke="#1B3038"/>
    <text x="512" y="372" fill="#5F7A76" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1.5">PROFILED LOCALLY</text>
    <text x="512" y="390" fill="#5F7A76" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1.5">4 COLUMNS · 3 ROWS</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M768 260h20M782 252l8 8-8 8" stroke="#2DD4BF" stroke-width="2.5" fill="none"/>

