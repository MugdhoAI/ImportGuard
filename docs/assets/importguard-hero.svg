      <text x="824" y="308" fill="#C4D6CF" font-family="Inter,Segoe UI,Arial,sans-serif">Email</text><path d="M938 304h14M946 298l7 6-7 6" stroke="#2DD4BF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" begin="0.44s" repeatCount="indefinite"/></path><text x="962" y="308" fill="#EAF4EF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5">email</text>
      <text x="824" y="342" fill="#C4D6CF" font-family="Inter,Segoe UI,Arial,sans-serif">Payment</text><path d="M938 338h14M946 332l7 6-7 6" stroke="#2DD4BF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" begin="0.66s" repeatCount="indefinite"/></path><text x="962" y="342" fill="#EAF4EF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5">payment_status</text>
    </g>
    <path d="M824 362H1048" stroke="#1B3038"/>
    <path d="M824 382l5 5 9-10" stroke="#4ADE80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></path><text x="846" y="388" fill="#4ADE80" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" letter-spacing="1.5">MAPPING APPROVED</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M1080 260h20M1094 252l8 8-8 8" stroke="#2DD4BF" stroke-width="2.5" fill="none"/>

