    <text x="1152" y="296" fill="#D89A83" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="2">REJECTED</text>
    <text x="1152" y="320" fill="#F7E3D7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">1 row</text>
    <text x="1352" y="320" fill="#C98F76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" text-anchor="end">“maybe” is not a boolean</text>
    <text x="1136" y="362" fill="#9FB4AC" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">accepted.csv · rejected.csv</text>
    <text x="1136" y="384" fill="#9FB4AC" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">recipe.json · report.json · ZIP</text>
  </g>

  <!-- Animation: processing wave across the three stages -->
  <rect x="488" y="118" width="272" height="284" rx="16" fill="#2DD4BF" opacity="0"><animate attributeName="opacity" values="0;.10;0;0" keyTimes="0;.18;.36;1" dur="3.6s" begin="0s" repeatCount="indefinite"/></rect>
  <rect x="800" y="118" width="272" height="284" rx="16" fill="#2DD4BF" opacity="0"><animate attributeName="opacity" values="0;.10;0;0" keyTimes="0;.18;.36;1" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></rect>
  <rect x="1112" y="118" width="272" height="284" rx="16" fill="#2DD4BF" opacity="0"><animate attributeName="opacity" values="0;.12;0;0" keyTimes="0;.18;.36;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></rect>
  <circle r="4" fill="#5EEAD4" opacity="0"><animateMotion dur="3.6s" begin="0.55s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.6s" begin="0.55s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#5EEAD4" opacity="0"><animateMotion dur="3.6s" begin="1.45s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.6s" begin="1.45s" repeatCount="indefinite"/></circle>

  <!-- Footer -->
  <path d="M56 446H1384" stroke="#12262D"/>
  <text x="56" y="474" fill="#55706B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2.5">LOCAL PROCESSING BY DEFAULT</text>
  <text x="1384" y="474" fill="#55706B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2.5" text-anchor="end">OPTIONAL MODEL SUGGESTIONS · HUMAN REVIEW REQUIRED</text>
</svg>
