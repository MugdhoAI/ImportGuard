[project]
name = "importguard"
version = "0.1.0"
description = "A local-first CSV mapping, validation, and recipe replay tool."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
